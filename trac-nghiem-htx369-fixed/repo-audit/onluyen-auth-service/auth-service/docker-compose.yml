version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onluyen_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: onluyen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth-service:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://onluyen_user:change_me@postgres:5432/onluyen
      JWT_ACCESS_SECRET: replace_with_long_random_string
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: localhost
    ports:
      - "4000:4000"

volumes:
  pgdata:
